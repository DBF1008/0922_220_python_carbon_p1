# Fixture with a mix of valid and invalid aggregation sections.
# Invalid sections must be logged and skipped without discarding
# the valid ones or aborting the whole load.
[min]
pattern = \.min$
xFilesFactor = 0.1
aggregationMethod = min

[bad_xfilesfactor_bounds]
pattern = \.bad_bounds$
xFilesFactor = 1.5
aggregationMethod = sum

[bad_xfilesfactor_value]
pattern = \.bad_value$
xFilesFactor = not_a_float
aggregationMethod = sum

[bad_aggregationmethod]
pattern = \.bad_method$
xFilesFactor = 0.5
aggregationMethod = not_a_method

[max]
pattern = \.max$
xFilesFactor = 0.2
aggregationMethod = max
